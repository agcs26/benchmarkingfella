<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look up benchmark result</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    p {
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }

    a.back {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>

<body>
  <h1>Look up a PCMark 10 result</h1>
  <p>Enter the result ID and it opens the result page on 3DMark.com in a new tab.</p>
  <input type="text" id="resultId" placeholder="e.g. 161743776">
  <button id="goBtn">Open result</button>
  <a class="back" href="/index.html">&larr; Back</a>

  <script>
    function openResult() {
      const id = document.getElementById('resultId').value.trim();
      if (!id) return;
      window.open('https://www.3dmark.com/pcm10/' + encodeURIComponent(id), '_blank');
    }
    document.getElementById('goBtn').addEventListener('click', openResult);
    document.getElementById('resultId').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') openResult();
    });
  </script>
</body>

</html>
